<main><small>LEGACY LINK / DENSO</small><h1>Kết nối máy chủ</h1><p>Nhập địa chỉ web trên máy Linux. Khi đổi Wi-Fi hoặc IP, cập nhật địa chỉ tại đây.</p><form><label for="server">Địa chỉ web</label><input id="server" type="url" placeholder="http://192.168.1.13:8080" required autocomplete="url"><button>Kết nối</button></form><p id="error" role="status"></p><small>Ứng dụng tiếp tục chạy ở khay hệ thống khi bấm X. Chọn Thoát từ menu khay để đóng hoàn toàn.</small></main><script src="setup.js"></script></html>
