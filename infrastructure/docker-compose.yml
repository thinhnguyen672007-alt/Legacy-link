# ==============================================================================
# [NOTE] Docker Compose Orchestration (docker-compose.yml)
#
# Role: Central definition file for starting, stopping, and networking all
# infrastructure services.
#
# ROLES BY PROFILE:
#
#   broker — broker and database only. Brought up when you pass --profile broker.
#            This is what fits a developer who just needs the messaging hop on
#            their machine, runs the Node apps manually next, and skips the rest.
#
#   full   — broker + database + consumer + HTTP API + authenticated gateway.
#            Frontend can be added when available.
#
#          Existing services (mosquitto-init, mosquitto, postgres) carry both
#          tags, so either profile brings them up. New services you add for
#          the containerized stack should carry only "full" to keep this file
#          from silently running them in a broker-only session.
#
#          Docker Compose's own name is "profiles". Reason it exists: if every
#          service MUST run every time, you don't need profiles — you use the
#          file as-is. If only SOME run at once, you must attach
#          `profiles:` to ALL services. Tags accept a list; every service
#          tagged "broker" runs when you pass --profile broker, every service
#          tagged "full" runs when you pass --profile full.
#
# Common commands (service name is required for -v because `docker compose`
# wraps the message instead of passing it through):
#   - Start broker only:     docker compose --profile broker up -d
#   - Start full stack:      docker compose --profile full up -d
#   - Stop everything:       docker compose down
#   - Check status:          docker compose ps
#   - View broker logs:      docker compose logs -f mosquitto
#   - Load DB schema:        docker compose exec -T postgres psql -U legacy_admin -d legacy_link < ../backend/db/schema.sql
# ==============================================================================
services:
  # One-shot preparation: derive UID/GID from the image, not the host user.
  # Profile: both "broker" and "full", so the database never sees a request
  # from a misconfigured broker and the broker never writes to a missing
  # directory.
  mosquitto-init:
    image: eclipse-mosquitto:2
    profiles: ["broker", "full"]
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "/init-mosquitto.sh"]
    volumes:
      - ./scripts/init-mosquitto.sh:/init-mosquitto.sh:ro,z
      - ./mosquitto/config:/mosquitto/config:z
      - ./mosquitto/data:/mosquitto/data:z
      - ./mosquitto/log:/mosquitto/log:z

  mosquitto:
    image: eclipse-mosquitto:2
    profiles: ["broker", "full"]
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      MQTT_USERNAME: ${MQTT_DEV_USER:-legacy_admin}
      MQTT_PASSWORD: ${MQTT_DEV_PASS:-legacy_secret_2026}
    # Publish QoS1 có xác thực chứng minh broker xử lý được tin, không chỉ process còn sống.
    # Dùng timeout bên ngoài vì mosquitto_pub trong image đã thử không hỗ trợ -W.
    # $$ giữ biến cho shell trong container; $ đơn có thể bị Compose nội suy ở máy host.
    healthcheck:
      test: ["CMD-SHELL", 'timeout 4 mosquitto_pub -h 127.0.0.1 -u "$$MQTT_USERNAME" -P "$$MQTT_PASSWORD" -t legacy-link/test/broker-health -m ready -q 1']
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s
    container_name: ${MQTT_CONTAINER_NAME:-legacy-link-mosquitto}
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      # `selinux: z` is applied on SELinux-enabled Linux hosts and ignored by
      # Docker Desktop on Windows/macOS.
      - type: bind
        source: ./mosquitto/config/mosquitto.conf
        target: /mosquitto/config/mosquitto.conf
        read_only: true
        bind:
          selinux: z
      - type: bind
        source: ./mosquitto/data
        target: /mosquitto/data
        bind:
          create_host_path: true
          selinux: z
      - type: bind
        source: ./mosquitto/config/passwd
        target: /mosquitto/config/passwd
        read_only: true
        bind:
          create_host_path: false
          selinux: z
      - type: bind
        source: ./mosquitto/log
        target: /mosquitto/log
        bind:
          create_host_path: true
          selinux: z
    networks:
      - legacy-link-net

  # ------------------------------------------------------------------------------
  # PostgreSQL — nơi lưu telemetry, trạng thái máy và alarm.
  #
  # BA BIẾN MÔI TRƯỜNG DướI ĐÂY KHÔNG PHẢI BẤT BUỘC:
  # Chúng chỉ tồn tại để Postgres "khởi tạo" lần đầu. Cụ thể, image postgres
  # đọc đúng 3 biến này vào đúng một thời điểm: lúc container khởi động lần
  # ĐẦU TIÊN, tức là lúc thư mục dữ liệu còn trống.
  #   POSTGRES_USER     -> tên user mặc định được tạo ra
  #   POSTGRES_PASSWORD -> mật khẩu của user đó
  #   POSTGRES_DB       -> tên database mặc định được tạo ra
  # Sau khi volume đã có dữ liệu, Postgres BỎ QUA hoàn toàn 3 biến này. Đổi
  # POSTGRES_USER trong .env rồi `up -d` lại sẽ KHÔNG tạo user mới — nếu bạn
  # cần đổi thật thì thay tài khoản trong DB có kiểm soát (xem runbook).
  #
  # VÌ SAO CẦN healthcheck:
  # Postgres sau khi bật listener vẫn còn vài giây để tạo database và chạy
  # script khởi tạo. Nếu backend khởi động đúng khoảnh thời gian đó, lệnh
  # kết nối đầu tiên sẽ bị từ chối và backend crash. `pg_isready` là lệnh có
  # sẵn trong image, trả về 0 khi database thật sự sẵn sàng nhận truy vấn —
  # đúng ý nghĩa ta cần, khác với việc chỉ kiểm tra tiến trình còn sống.
  # Sau đó `docker compose ps` sẽ hiện cột STATUS là `healthy` thay vì `Up`.
  # ------------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    profiles: ["broker", "full"]
    # Tên container này KHÔNG tùy ý đặt. `backend/scripts/test-messages.sh`
    # (nhánh feature/backend-base) hardcode biến `POSTGRES=legacy-link-postgres`
    # và dùng nó để `docker ps | grep`, đồng thời `backend/db/schema.sql` ghi
    # sẵn câu lệnh `docker exec -i legacy-link-postgres psql ...` trong comment.
    # Đổi tên ở đây thì script của team backend hỏng mà không có báo lỗi rõ.
    # Nếu bạn buộc phải đổi thì sửa cả hai file kia cùng lúc.
    restart: unless-stopped
    container_name: ${POSTGRES_CONTAINER_NAME:-legacy-link-postgres}
    # Dạng mapping `KEY: value` (không phải dạng danh sách `- KEY=value` như ở
    # compose cũ). Cả hai đều hợp lệ, nhưng mapping đọc dễ hơn khi giá trị chứa
    # `:` hoặc ký tự đặc biệt. Ở đây giá trị lấy từ ${...} của Compose, nên
    # ${...} bên trong được Compose nội suy trước, rồi mới truyền vào container.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legacy_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-legacy_link}
    ports:
      # Cú pháp ngắn: "<ip_host>:<port_host>:<port_container>". Ba phần với dấu
      # hai chấm. Ở mosquitto ở trên dùng long syntax (`type: bind` + `target:`),
      # ở đây dùng cú pháp ngắn vì chỉ cần ánh xạ cổng thuần, không cần thêm
      # tuỳ chọn nào. Hai kiểu MIXED trong cùng file là bình thường — chọn cái
      # nào đủ dùng cho khối đó.
      #
      # VÌ SAO CHỈ BIND 127.0.0.1:
      # backend chạy trên máy host (không phải container) nên vẫn kết nối được
      # qua localhost:5432, nhưng máy khác trong LAN không thấy cổng này.
      # Nếu mở "5432:5432" (tức 0.0.0.0) thì database — với mật khẩu yếu
      # `change_me` mặc định — sẽ bị chạm từ mọi máy trong mạng.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume thay vì bind mount thư mục:
      # Postgres cần quyền ghi POSIX đặc biệt trên thư mục dữ liệu, bind mount
      # thường gây lỗi quyền khi chạy bằng UID của user desktop. Named volume
      # do Docker tạo với owner đúng (uid 70 trong image alpine) nên không lỗi.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `test` là DANH SÁCH, phần tử đầu là CÁCH chạy lệnh:
      #   "CMD"       -> chạy lệnh trực tiếp, KHÔNG qua shell
      #   "CMD-SHELL" -> chạy qua /bin/sh -c, CÓ nội suy biến shell
      # Phần tử thứ hai là lệnh dạng chuỗi.
      # Ở đây phải dùng CMD-SHELL vì lệnh có chứa ${...}: Compose nội suy được
      # các biến ${POSTGRES_USER:-...} trong file compose, nhưng bên trong
      # container, `pg_isready -U $POSTGRES_USER` mới cần shell để đọc biến môi
      # trường thật của Postgres. Dùng "CMD" thì chuỗi đó bị truyền nguyên văn
      # vào execve, Postgres sẽ tưởng tên user là chuỗi "${POSTGRES_USER".
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legacy_admin} -d ${POSTGRES_DB:-legacy_link}"]
      # Mỗi `interval` giây chạy lệnh trên một lần trong container.
      interval: 5s
      # Một lần chạy mà quá `timeout` giây vẫn chưa xong thì tính là thất bại.
      # Giá trị này phải nhỏ hơn interval, nếu không hai lần kiểm tra chồng lấn.
      timeout: 5s
      # Thất bại `retries` lần liên tiếp thì đánh dấu container là unhealthy.
      # 12 x 5s = tối đa chờ 60 giây. Quá lâu thì `up -d` bị treo vô ích khi
      # máy yếu; quá ngắn thì container bị đánh dấu unhealthy dù chỉ vì khởi
      # động chậm.
      retries: 12
      # Khoảng "miễn trừ" ngay sau khi container vừa bật: trong 10 giây này thất
      # bại KHÔNG tính vào `retries`. Postgres cần vài giây để tạo database
      # dù chưa sẵn sàng thì `pg_isready` cũng chạy được (nó chỉ kiểm tra
      # server nghe kết nối, không kiểm tra bảng). Không có `start_period`,
      # lần `pg_isready` đầu tiên quá sớm sẽ bị tính nhầm là lỗi.
      start_period: 10s
    networks:
      - legacy-link-net

  # ------------------------------------------------------------------------------
  # backend-consumer — consumer MQTT của backend (Node.js) đọc log và lệnh.
  #
  # VÌ SAO CẦN THÊM KHỐI NÀY:
  # Trước đây broker + postgres chạy trong Docker, còn bản thân Node backend
  # chạy tay từ terminal (`npm start`). Nghĩa là mỗi lần deploy phải mở thêm
  # terminal, quên thì không ai biết. Đóng gói consumer vào image riêng giúp
  # toàn hệ thống chỉ cần `docker compose up -d` là lên đủ.
  #
  #   build: ../backend
  #     Đường dẫn tới thư mục có backend/Dockerfile. Compose chạy `docker build`
  #     lần đầu, lần sau dùng lại image trừ khi sửa Dockerfile hoặc package.json.
  #
  #   depends_on với condition:
  #     postgres phải healthy (pg_isready OK) rồi mới start backend, tránh
  #     crash vì backend cố kết nối trước khi Postgres sẵn sàng.
  #     mosquitto-init chạy một lần (service_completed_successfully) để tạo
  #     xong config/passwd của broker.
  #
  #   environment:
  #     MQTT_URL phải trỏ `mqtt://mosquitto:1883` chứ KHÔNG phải localhost,
  #     vì consumer chạy trong container — `localhost` ở đây là chính nó,
  #     không phải broker. Giống `postgres:5432` cho DATABASE_URL.
  #     MQTT_USERNAME / MQTT_PASSWORD dùng cùng tài khoản broker đã khai báo
  #     trong infrastructure/.env (MQTT_DEV_USER / MQTT_DEV_PASS) để khớp với
  #     hash trong mosquitto/config/passwd.
  #
  #   restart: unless-stopped
  #     Tự chạy lại sau crash/daemon restart; dừng bằng tay thì giữ trạng thái dừng.
  #
  #   profiles: ["full"]
  #     Chỉ chạy khi dùng profile full. Dev local chỉ cần broker+postgres thì
  #     dùng --profile broker, service này đứng yên, backend vẫn chạy tay được.
  # ------------------------------------------------------------------------------
  backend-consumer:
    build: ../backend
    container_name: ${CONSUMER_CONTAINER_NAME:-legacy-link-consumer}
    # Wrapper infra giám sát readiness, sau đó chạy đúng entrypoint consumer của backend.
    command: ["node", "/app/infra-run.cjs", "consumer"]
    restart: unless-stopped
    profiles: ["full"]
    volumes:
      - ./scripts/run-backend.cjs:/app/infra-run.cjs:ro,z
      - type: bind
        # Mount script kiểm tra từ infra; không đưa code kiểm tra vào source backend.
        source: ./scripts/check-backend.cjs
        target: /app/infra-check.cjs
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    healthcheck:
      test: ["CMD", "node", "/app/infra-check.cjs"]
      interval: 10s
      timeout: 8s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: ${MQTT_DEV_USER:-legacy_admin}
      MQTT_PASSWORD: ${MQTT_DEV_PASS:-legacy_secret_2026}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-legacy-link-backend}
      MQTT_QOS: ${MQTT_QOS:-2}
      DATABASE_URL: postgres://${POSTGRES_USER:-legacy_admin}:${POSTGRES_PASS:-change_me}@postgres:5432/${POSTGRES_DB:-legacy_link}
    networks:
      - legacy-link-net

  # API là tiến trình Node riêng; thiếu service này thì consumer nhận tin nhưng HTTP không chạy.
  # Không publish cổng API trực tiếp ra host để request ghi luôn đi qua gateway có token.
  backend-api:
    build: ../backend
    container_name: ${API_CONTAINER_NAME:-legacy-link-api}
    profiles: ["full"]
    restart: unless-stopped
    command: ["node", "/app/infra-run.cjs", "api"]
    volumes:
      - ./scripts/run-backend.cjs:/app/infra-run.cjs:ro,z
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: ${MQTT_DEV_USER:-legacy_admin}
      MQTT_PASSWORD: ${MQTT_DEV_PASS:-legacy_secret_2026}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-legacy-link-backend}
      MQTT_QOS: ${MQTT_QOS:-2}
      DATABASE_URL: postgres://${POSTGRES_USER:-legacy_admin}:${POSTGRES_PASS:-change_me}@postgres:5432/${POSTGRES_DB:-legacy_link}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 25s
    networks:
      - legacy-link-net

  # Gateway là cửa vào từ trình duyệt. API có thể đang lỗi dependency nhưng process đã bật,
  # nên chỉ đợi service_started để vẫn truy cập được live/ready và thấy lỗi thực tế.
  api-gateway:
    image: nginx:1.28-alpine
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_started
    environment:
      API_WRITE_TOKEN: ${API_WRITE_TOKEN:-}
      # Chỉ thay biến token trong template; giữ nguyên các biến $request_method/$api của Nginx.
      NGINX_ENVSUBST_FILTER: API_WRITE_TOKEN
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro,z
      - ./nginx/05-token-check.sh:/docker-entrypoint.d/05-token-check.sh:ro,z
    ports:
      # Cổng bên ngoài có thể đổi mà Node vẫn nghe 3000 trong mạng Docker.
      # IP bind do .env quyết định; PostgreSQL vẫn chỉ publish trên loopback.
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/ready"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 25s
    networks:
      - legacy-link-net

networks:
  legacy-link-net:
    name: ${DOCKER_NETWORK_NAME:-legacy-link-net}
    driver: bridge

volumes:
  # Khai báo named volume ở tầng top-level (ngang hàng với `services` và
  # `networks`). Nếu khai báo tên volume trong `services.postgres.volumes` mà
  # không có khối `volumes:` tương ứng, Docker coi đó là bind mount và tạo một
  # thư mục rỗng — dữ liệu sẽ nằm trong thư mục đó chứ không phải trong volume.
  postgres-data:
