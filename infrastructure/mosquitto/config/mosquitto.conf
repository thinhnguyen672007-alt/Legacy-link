# ==============================================================================
# [NOTE] Mosquitto Configuration File (mosquitto.conf)
#
# Role: Defines runtime behavior, network listeners, and security parameters
# for the Eclipse Mosquitto MQTT broker container.
#
# How to write / modify:
# - Use standard Mosquitto configuration syntax (`key value`).
# - Changes require restarting the container: `docker compose restart mosquitto`.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Network Listener
# ------------------------------------------------------------------------------
# Listen on port 1883 across all network interfaces (0.0.0.0).
# This allows external devices (ESP32) and local Docker containers to connect.
listener 1883 0.0.0.0

# ------------------------------------------------------------------------------
# 2. Security & Authentication
# ------------------------------------------------------------------------------
# Disable anonymous access. Every client must provide a valid username and password.
allow_anonymous false

# Path to the password file inside the container.
# This file is mounted from the host at `./mosquitto/config/passwd`.
# Generate or update credentials using `scripts/setup-mosquitto-auth.sh`.
password_file /mosquitto/config/passwd

# ------------------------------------------------------------------------------
# 3. Message Persistence
# ------------------------------------------------------------------------------
# Save queued messages and persistent subscriptions to disk (mosquitto.db).
# Retains data across container restarts.
persistence true
persistence_location /mosquitto/data/

# ------------------------------------------------------------------------------
# 4. Logging & Diagnostics
# ------------------------------------------------------------------------------
# Direct log messages to both stdout (for `docker compose logs`) and a disk file.
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log

# Log detail levels: error, warning, notice, information
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true