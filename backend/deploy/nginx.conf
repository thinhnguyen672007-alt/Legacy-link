# Backend là nơi quyết định quyền và CORS; proxy giữ Authorization từ frontend.
server {
 listen 80;
 server_tokens off;
 client_max_body_size 12k;
 location / {
   resolver 127.0.0.11 valid=10s ipv6=off;
   set $backend http://api:3000;
   proxy_pass $backend;
   proxy_set_header Host $host;
   proxy_set_header Authorization $http_authorization;
   proxy_connect_timeout 3s;
   # AI: 12s model + 8s đọc dữ liệu, đệm trước timeout frontend 35s.
   proxy_read_timeout 30s;
 }
}
