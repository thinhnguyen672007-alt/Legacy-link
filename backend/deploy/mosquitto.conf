# C15: mẫu broker TLS; Huy cấp certificate/password file trước khi triển khai.
listener 8883
allow_anonymous false
password_file /mosquitto/secrets/passwords
acl_file /mosquitto/config/acl
certfile /mosquitto/secrets/server.crt
keyfile /mosquitto/secrets/server.key
persistence true
persistence_location /mosquitto/data/
max_packet_size 20000
message_size_limit 16384
max_queued_messages 1000
