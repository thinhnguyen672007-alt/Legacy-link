# C13: hai tiến trình dùng cùng image; kết nối DB/broker do Huy vận hành.
# Chạy từ backend: docker compose --env-file .env.compose up --build -d
services:
  consumer:
    build: .
    env_file: .env.compose
    init: true
    restart: unless-stopped
    stop_grace_period: 25s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [node, src/index.js]
    networks: [legacy]
  api:
    build: .
    env_file: .env.compose
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3000
      NODE_ENV: production
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [node, src/http/server.js]
    ports: ['127.0.0.1:3000:3000']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 20s
    stop_grace_period: 25s
    networks: [legacy]
networks:
  legacy:
    external: true
    name: ${LEGACY_NETWORK:-legacy-link_default}
