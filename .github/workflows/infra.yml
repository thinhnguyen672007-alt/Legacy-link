name: Infrastructure

on:
  push:
    paths: ['infrastructure/**', 'backend/**', 'frontend/**', '.github/workflows/infra.yml']
  pull_request:
    paths: ['infrastructure/**', 'backend/**', 'frontend/**', '.github/workflows/infra.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # compose interpolates ${API_READ_TOKEN:?Run scripts/prepare-env.mjs first}, so
      # create a throwaway .env before validating, the same way setup.sh does.
      - name: Prepare a sample environment
        working-directory: infrastructure
        run: node scripts/prepare-env.mjs

      - name: Validate the Compose file
        working-directory: infrastructure
        run: COMPOSE_PROFILES=full docker compose config --quiet

      - name: Check shell script syntax
        run: |
          for script in infrastructure/scripts/*.sh infrastructure/nginx/*.sh; do
            bash -n "$script"
          done

      - name: Check Node script syntax
        run: |
          for script in infrastructure/scripts/*.cjs infrastructure/scripts/*.mjs; do
            node --check "$script"
          done

      - name: Check environment preparation
        run: node --test infrastructure/test/prepare-env.test.mjs
