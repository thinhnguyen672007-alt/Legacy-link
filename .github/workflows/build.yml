name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PlatformIO
        uses: n-vr/setup-platformio-action@v1

      - name: Build ESP32 firmware
        run: pio run -d firmware/legacy-link-core